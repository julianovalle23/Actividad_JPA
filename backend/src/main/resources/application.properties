spring.application.name=campusdesk
server.port=8080

# Database: user and password come from the environment, never from code.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/technova_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Session runs in UTC so the updated_at trigger matches the dates
# saved by JPA (Hibernate writes Instant in UTC). Without this, updated_at
# would lag 5 hours behind and the updated_at >= created_at CHECK would fail.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Hibernate only VALIDATES the structure on startup (never modifies it).
# database/schema.sql is the single source of truth for tables, columns,
# constraints, indexes and triggers. Verified with ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: the secret is required (minimum 32 characters).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS: only the frontend origins (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Safe provisioning of ADMIN and TECHNICIAN (only when their variables exist).
app.seed.admin-name=${ADMIN_NAME:Administrador CampusDesk}
app.seed.admin-email=${ADMIN_EMAIL:}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.technician-name=${TECH_NAME:Tecnico CampusDesk}
app.seed.technician-email=${TECH_EMAIL:}
app.seed.technician-password=${TECH_PASSWORD:}

# Errors never expose internal messages or traces.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Swagger.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
