spring.application.name=tienda-vivero
server.port=8080

# ===== H2 (base de datos en memoria, ideal para practicar) =====
spring.datasource.url=jdbc:h2:mem:viverodb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== MySQL (descomenta esto y comenta H2 si quieres usar MySQL) =====
#spring.datasource.url=jdbc:mysql://localhost:3306/vivero_db?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Ejecuta data.sql DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
